# /etc/nginx/sites-available/lunch-picker (예시). lunch.example.com 을 실제 도메인으로 바꿔서 쓴다.
# 정적 파일: /var/www/lunch-picker  (frontend 에서 `npm run build` 한 dist 내용)
# API:        127.0.0.1:8001 (uvicorn, deploy/lunch-picker.service)

server {
    listen 80;
    server_name lunch.example.com;

    # Let's Encrypt 인증서 발급·갱신용 경로, 나머지는 모두 HTTPS 로 보낸다.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name lunch.example.com;

    ssl_certificate     /etc/letsencrypt/live/lunch.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lunch.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    root /var/www/lunch-picker;
    index index.html;

    # API: 백엔드로 전달한다.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 클라이언트가 보낸 X-Forwarded-For 는 믿지 않고 접속자 IP 로 덮어쓴다.
        # (백엔드의 TRUST_PROXY=true 와 짝: 로그인 시도 속도 제한이 이 값을 접속자 IP 로 쓴다)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 빌드 결과물(파일명에 해시가 들어 있어 오래 캐시해도 된다)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: 알 수 없는 경로는 index.html 로 돌려 화면 라우터가 처리하게 한다.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
